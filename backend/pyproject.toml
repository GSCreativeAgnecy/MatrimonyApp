[project]
name = "matchmaking-api"
version = "0.1.0"
description = "Production-ready matrimony/matchmaking backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<0.116",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0.29,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "redis>=5.0",
    "email-validator>=2.1",
    "boto3>=1.34",
    "arq>=0.26",
    "orjson>=3.10",
    "python-multipart>=0.0.9",
    "tenacity>=8.2",
    "pyotp>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 119
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008"]  # FastAPI Depends in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "E501"]
"migrations/*" = ["E501"]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
exclude = ["tests/", "migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/db/models/*"]
